[project]
name = "lindi"
version = "0.4.6"
description = ""
authors = [
    {name = "Jeremy Magland", email = "jmagland@flatironinstitute.org"},
    {name = "Ryan Ly", email = "rly@lbl.gov"},
    {name = "Oliver Ruebel", email = "oruebel@lbl.gov"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "zarr>=2.16.1,<3",
    "h5py>=3.10.0",
    "requests>=2.31.0",
    "tqdm>=4.66.4",
]

[dependency-groups]
dev = [
    "pynwb>=2.6.0",
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.3",
]

[tool.poetry]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git'
check-hidden = true
# ignore-regex = ''
ignore-words-list = 'tempory'