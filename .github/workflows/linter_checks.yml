name: linter-checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Linter checks
    steps:
    - uses: actions/checkout@v1
    # numcodecs<0.16, required by zarr<3, has no wheels for Python 3.14
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install
      run: pip install .
    - name: Install packages needed for tests
      run: pip install flake8 pytest
    - name: Run flake8
      run: cd lindi && flake8 --config ../.flake8
